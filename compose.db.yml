name: yanov-local-db
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run env:init first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init first}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run env:init first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55438}:5432"
    volumes:
      - yanov_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  yanov_pgdata:
